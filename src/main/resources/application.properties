spring.application.name=CivicPortal
server.port=${PORT:8080}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.evidence.storage-dir=${EVIDENCE_STORAGE_DIR:uploads/evidence}
app.evidence.max-files-per-complaint=5
app.evidence.max-file-size-bytes=10485760

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civic_garbage_portal}
spring.datasource.username=${DB_USERNAME:civic_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=30
app.storage.local-root=${EVIDENCE_STORAGE_ROOT:./data/evidence}
